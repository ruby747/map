<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>나만의 카카오맵 장소 기록</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    /* 스타일은 그대로 유지 */
    :root{--bg:#0f172a;--panel:#111827;--accent:#22d3ee;--accent-2:#a78bfa;--muted:#94a3b8;--text:#e2e8f0;--card:#1f2937;}
    *{box-sizing:border-box;}
    body{margin:0;padding:32px;font-family:'Noto Sans KR', sans-serif;background:radial-gradient(circle at 20% 20%, #1e293b 0, #0b1224 40%, #0b1224 100%);color:var(--text);}
    h1,h2{margin:0 0 12px 0;}h1{font-size:26px;}h2{font-size:18px;color:var(--accent);}
    .app{display:grid;grid-template-columns: 2fr 1fr;gap:18px;}
    .panel{background:var(--panel);border:1px solid #1f2937;border-radius:16px;padding:16px;box-shadow:0 25px 60px rgba(0,0,0,0.35);}
    #map{width:100%;height:520px;border-radius:12px;background:#0b1224;border:1px solid #1f2937;}
    .toolbar{display:flex;gap:10px;margin-bottom:10px;align-items:center;}
    .controls{display:grid;gap:12px;}
    .field{display:flex;flex-direction:column;gap:6px;}
    input,textarea,select,button{border:none;border-radius:10px;padding:10px;background:var(--card);color:var(--text);}
    input:focus{outline:2px solid var(--accent);}
    button{cursor:pointer;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#0b1224;font-weight:700;}
    .ghost{background:var(--card);color:var(--text);box-shadow:none;}
    .pill{border-radius:40px;padding:6px 10px;background:#0f172a;border:1px solid #1f2937;font-size:12px;color:var(--muted);}
    .list{display:grid;gap:10px;margin-top:8px;max-height:320px;overflow:auto;}
    .card{background:var(--card);border-radius:12px;padding:12px;border:1px solid #1f2937;}
    .auth-card{background:rgba(255,255,255,0.02);border:1px dashed #1f2937;border-radius:12px;padding:12px;}
    .status-line{display:inline-flex;padding:6px 10px;border-radius:999px;background:rgba(34,211,238,.12);color:var(--accent);font-size:13px;}
    .inline-actions{display:flex;gap:8px;}
    @media (max-width: 980px){.app{grid-template-columns:1fr;}#map{height:60vh;}}
  </style>
</head>
<body>
  <header style="margin-bottom:14px;">
    <h1>카카오맵으로 나만의 장소 기록</h1>
    <div class="status-line" id="syncStatus">서버 연결 대기 중...</div>
  </header>
  <main class="app">
    <section class="panel">
      <div class="toolbar">
        <button id="locateMe" class="ghost">📍 내 위치</button>
        <div class="pill">필터 <select id="categoryFilter" style="background:transparent;border:none;color:var(--text);"><option value="all">전체</option></select></div>
        <div class="pill">선택됨: <span id="selectedStatus">없음</span></div>
      </div>
      <div id="map"></div>
    </section>
    <section class="panel controls">
      <div class="auth-card">
        <h2>로그인 / 회원가입</h2>
        <div id="authStatus" style="font-size:12px; color:var(--muted); margin-bottom:8px;">로그인 필요</div>
        <form class="controls">
          <input id="authEmail" type="email" placeholder="이메일" />
          <input id="authPassword" type="password" placeholder="비밀번호 (6자 이상)" />
          <div class="inline-actions">
            <button type="button" id="signInBtn" class="ghost">로그인</button>
            <button type="button" id="signUpBtn" class="ghost">회원가입</button>
            <button type="button" id="signOutBtn" class="ghost" style="display:none;">로그아웃</button>
          </div>
        </form>
      </div>
      <div>
        <h2>장소 추가</h2>
        <form id="placeForm" class="controls">
          <input id="title" name="title" type="text" placeholder="장소 이름" required />
          <input id="category" name="category" type="text" placeholder="카테고리" list="categoryList" />
          <datalist id="categoryList"></datalist>
          <div class="field">
            <label>별점 <span id="ratingValue">3</span></label>
            <input id="rating" name="rating" type="range" min="1" max="5" value="3" />
          </div>
          <textarea id="review" name="review" placeholder="후기"></textarea>
          <div style="display:flex; gap:8px;">
            <input id="addressSearch" type="search" placeholder="주소 검색" style="flex:1;" />
            <button type="button" id="searchAddress" class="ghost">이동</button>
          </div>
          <button type="submit">저장하기</button>
        </form>
      </div>
      <div class="list" id="placeList"></div>
    </section>
  </main>

  <script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=70c237708cd3341e725769b6750b4be6&libraries=services"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <script>
    // ==========================================
    // 1. Supabase 설정 (강제 주입 방식)
    // ==========================================
    const SUPABASE_URL = 'https://ajvyclxrdvqsakgpbusi.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFqdnljbHhyZHZxc2FrZ3BidXNpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjczNTU3MjAsImV4cCI6MjA4MjkzMTcyMH0.9fnpb-hxIc9awbBuqz96yQKf6FbLKR1a6YJNs91uVOY';

    // ★ 핵심 수정: localStorage를 직접 래핑해서 전달 (에러 원천 봉쇄)
    const MyStorage = {
        getItem: (key) => { return window.localStorage.getItem(key); },
        setItem: (key, value) => { window.localStorage.setItem(key, value); },
        removeItem: (key) => { window.localStorage.removeItem(key); }
    };

    let supabaseClient;
    try {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
            auth: {
                storage: MyStorage, // 여기서 우리가 만든 저장소를 강제로 쓰게 함
                autoRefreshToken: true,
                persistSession: true,
                detectSessionInUrl: false
            }
        });
        console.log("Supabase 클라이언트 준비 완료");
    } catch (e) {
        console.error("초기화 에러:", e);
        document.getElementById('syncStatus').innerText = "DB 연결 실패";
    }

    // ==========================================
    // 2. 변수 및 맵 설정
    // ==========================================
    const mapContainer = document.getElementById('map');
    let map, geocoder, currentUser = null;
    let places = [], markers = [];
    let selectedLatLng = null, selectionMarker = null, infoWindow = null;

    // UI 요소들
    const ui = {
        title: document.getElementById('title'),
        category: document.getElementById('category'),
        rating: document.getElementById('rating'),
        review: document.getElementById('review'),
        status: document.getElementById('syncStatus'),
        list: document.getElementById('placeList'),
        catList: document.getElementById('categoryList'),
        catFilter: document.getElementById('categoryFilter'),
        selectedStatus: document.getElementById('selectedStatus'),
        authEmail: document.getElementById('authEmail'),
        authPass: document.getElementById('authPassword'),
        authStatus: document.getElementById('authStatus'),
        btns: {
            signIn: document.getElementById('signInBtn'),
            signUp: document.getElementById('signUpBtn'),
            signOut: document.getElementById('signOutBtn')
        }
    };

    // 상태 업데이트
    function setStatus(msg, type='info') {
        ui.status.innerText = msg;
        ui.status.style.color = type === 'error' ? '#f87171' : 'var(--accent)';
    }

    // 맵 초기화
    function initMap() {
        map = new kakao.maps.Map(mapContainer, {
            center: new kakao.maps.LatLng(37.5665, 126.9780),
            level: 4
        });
        geocoder = new kakao.maps.services.Geocoder();
        infoWindow = new kakao.maps.InfoWindow({zIndex:1});

        // 클릭 이벤트
        kakao.maps.event.addListener(map, 'click', function(mouseEvent) {
            selectedLatLng = mouseEvent.latLng;
            if(selectionMarker) selectionMarker.setMap(null);
            
            selectionMarker = new kakao.maps.Marker({ position: selectedLatLng });
            selectionMarker.setMap(map);
            
            ui.selectedStatus.innerText = "위치 선택됨";
            if(infoWindow) infoWindow.close();
        });

        // 내 위치
        document.getElementById('locateMe').addEventListener('click', () => {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => {
                    const latlng = new kakao.maps.LatLng(pos.coords.latitude, pos.coords.longitude);
                    map.panTo(latlng);
                });
            }
        });
    }

    // 주소 검색
    document.getElementById('searchAddress').addEventListener('click', () => {
        const q = document.getElementById('addressSearch').value;
        if(!q) return;
        geocoder.addressSearch(q, (result, status) => {
            if (status === kakao.maps.services.Status.OK) {
                const coords = new kakao.maps.LatLng(result[0].y, result[0].x);
                map.panTo(coords);
                // 검색된 위치 자동 선택
                selectedLatLng = coords;
                if(selectionMarker) selectionMarker.setMap(null);
                selectionMarker = new kakao.maps.Marker({ position: coords, map: map });
                ui.selectedStatus.innerText = "검색 위치 선택됨";
            } else {
                alert('주소를 못 찾겠어요.');
            }
        });
    });

    // ==========================================
    // 3. 데이터 로직 (Supabase)
    // ==========================================
    async function loadPlaces() {
        if (!currentUser) {
            places = [];
            render();
            return;
        }
        setStatus('데이터 불러오는 중...');
        const { data, error } = await supabaseClient
            .from('places')
            .select('*')
            .eq('user_id', currentUser.id)
            .order('created_at', { ascending: false });

        if (error) {
            console.error(error);
            setStatus('데이터 로드 실패', 'error');
        } else {
            places = data || [];
            setStatus(`로그인됨 (${places.length}개)`, 'ok');
            render();
        }
    }

    async function savePlace(e) {
        e.preventDefault();
        if (!currentUser) return alert('로그인이 필요해요!');
        if (!selectedLatLng) return alert('지도에서 위치를 찍어주세요!');

        const payload = {
            user_id: currentUser.id,
            title: ui.title.value,
            category: ui.category.value,
            rating: ui.rating.value,
            review: ui.review.value,
            lat: selectedLatLng.getLat(),
            lng: selectedLatLng.getLng()
        };

        const { data, error } = await supabaseClient.from('places').insert([payload]).select();
        
        if (error) {
            console.error(error);
            alert('저장 실패! (로그 확인 필요)');
        } else {
            setStatus('저장 완료!', 'ok');
            document.getElementById('placeForm').reset();
            selectedLatLng = null;
            if(selectionMarker) selectionMarker.setMap(null);
            ui.selectedStatus.innerText = "없음";
            loadPlaces(); // 목록 새로고침
        }
    }

    async function deletePlace(id) {
        if(!confirm('진짜 삭제할까요?')) return;
        const { error } = await supabaseClient.from('places').delete().eq('id', id);
        if(!error) loadPlaces();
    }

    // ==========================================
    // 4. 화면 렌더링
    // ==========================================
    function render() {
        // 기존 마커 제거
        markers.forEach(m => m.setMap(null));
        markers = [];
        ui.list.innerHTML = '';

        // 필터링
        const filter = ui.catFilter.value;
        const filtered = filter === 'all' ? places : places.filter(p => p.category === filter);

        // 카테고리 업데이트
        const cats = [...new Set(places.map(p => p.category).filter(Boolean))];
        ui.catList.innerHTML = cats.map(c => `<option value="${c}">`).join('');
        // 필터 옵션 유지하면서 업데이트
        if(ui.catFilter.children.length <= 1) {
            ui.catFilter.innerHTML = '<option value="all">전체</option>' + cats.map(c => `<option value="${c}">${c}</option>`).join('');
        }

        filtered.forEach(p => {
            // 마커 생성
            const marker = new kakao.maps.Marker({
                position: new kakao.maps.LatLng(p.lat, p.lng),
                map: map
            });
            
            kakao.maps.event.addListener(marker, 'click', () => {
                infoWindow.setContent(`<div style="padding:10px;color:#000;"><b>${p.title}</b><br>★${p.rating}</div>`);
                infoWindow.open(map, marker);
            });
            markers.push(marker);

            // 리스트 생성
            const item = document.createElement('div');
            item.className = 'card';
            item.innerHTML = `
                <div style="display:flex;justify-content:space-between;">
                    <strong>${p.title}</strong>
                    <span style="font-size:12px;color:var(--accent);">${p.category||'-'}</span>
                </div>
                <div style="font-size:14px;margin:4px 0;">${p.review||''}</div>
                <div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px;">
                    <span style="color:#f59e0b;">★${p.rating}</span>
                    <button class="ghost" style="color:#f87171;padding:4px;" onclick="deletePlace(${p.id})">삭제</button>
                </div>
            `;
            // 클릭시 이동
            item.addEventListener('click', (e) => {
                if(e.target.tagName !== 'BUTTON') {
                    map.panTo(new kakao.maps.LatLng(p.lat, p.lng));
                    infoWindow.setContent(`<div style="padding:10px;color:#000;"><b>${p.title}</b></div>`);
                    infoWindow.open(map, marker);
                }
            });
            ui.list.appendChild(item);
        });
    }

    document.getElementById('placeForm').addEventListener('submit', savePlace);
    ui.catFilter.addEventListener('change', render);
    document.getElementById('rating').addEventListener('input', (e) => document.getElementById('ratingValue').innerText = e.target.value);

    // ==========================================
    // 5. 로그인/회원가입 (에러 수정됨)
    // ==========================================
    async function handleAuth(mode) {
        const email = ui.authEmail.value;
        const pw = ui.authPass.value;
        if (!email || !pw) return alert('이메일/비번 입력해!');

        try {
            const { data, error } = mode === 'up' 
                ? await supabaseClient.auth.signUp({ email, password: pw })
                : await supabaseClient.auth.signInWithPassword({ email, password: pw });

            if (error) throw error;
            alert(mode === 'up' ? '가입 성공! 이메일 확인해봐.' : '로그인 성공!');
            ui.authEmail.value = ''; ui.authPass.value = '';
        } catch (err) {
            alert('에러: ' + err.message);
        }
    }

    ui.btns.signIn.addEventListener('click', () => handleAuth('in'));
    ui.btns.signUp.addEventListener('click', () => handleAuth('up'));
    ui.btns.signOut.addEventListener('click', async () => {
        await supabaseClient.auth.signOut();
    });

    // 초기 실행
    window.onload = async () => {
        initMap();
        
        // 세션 체크
        const { data } = await supabaseClient.auth.getSession();
        currentUser = data.session?.user;
        updateAuthUI();
        if(currentUser) loadPlaces();

        // 로그인 상태 변경 감지
        supabaseClient.auth.onAuthStateChange((event, session) => {
            currentUser = session?.user;
            updateAuthUI();
            if(currentUser) loadPlaces();
            else { places = []; render(); }
        });
    };

    function updateAuthUI() {
        if (currentUser) {
            ui.authStatus.innerText = `${currentUser.email}님 환영!`;
            ui.btns.signIn.style.display = 'none';
            ui.btns.signUp.style.display = 'none';
            ui.btns.signOut.style.display = 'inline-block';
        } else {
            ui.authStatus.innerText = "로그인 필요";
            ui.btns.signIn.style.display = 'inline-block';
            ui.btns.signUp.style.display = 'inline-block';
            ui.btns.signOut.style.display = 'none';
        }
    }
  </script>
</body>
</html>
