<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>22_2Geolocation.html</title>
</head>
<body>
    <fieldset style="width: 60%;">
        <legend>Geolocation API : 현재 위치 갱신하기</legend>
        <button onclick="start()">위치 추적 시작</button>
        <button onclick="stop()">위치 추적 종료</button>
        <div id="display" style="color: red; font-size: 1.5em; font-weight: bold;"></div>
    </fieldset>
    <script>
        var watcher;
        var divNode = document.querySelector("#display");
        if(navigator.geolocation){
            divNode.textContent = 'Geolocation API지원 브라우저'
        };
        function start(){
            if(navigator.geolocation){
                //현재 위치 정보를 5초마다 갱신해서 얻기
                var options={enableHighAccuracy:true,timeout:3000,maximumAge:5000};
                watcher=navigator.geolocation.watchPosition(position=>{
                    var lat = position.coords.latitude;
                    var lng = position.coords.longitude;
                    divNode.textContent=`위도:${lat},경도:${lng}`;
                },error=>{
                    switch(error.code){
                        case 0:divNode.textContent="알 수 없는 오류"; break;
                        case 1:divNode.textContent="허용 거부"; break;
                        case 2:divNode.textContent="위치 확인 불가"; break;
                        case 3:divNode.textContent="시간 초과"; break;
                        default : divNode.textContent=error.message;
                }
                },options)
            };
        };
        function stop(){
            console.log('watcher:',watcher);
            navigator.geolocation.clearWatch(watcher);
            divNode.textContent="위치 추적 중지";
        };
    </script>
</body>
</html>
